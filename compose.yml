services:
  db:
    image: postgres:16-alpine
    container_name: ai-task-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-taskmanagement}
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d ${DB_NAME:-taskmanagement}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: ai-task-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://app:password@db:5432/${DB_NAME:-taskmanagement}
      PYTHONPATH: /app
    volumes:
      - ./backend:/app
      - mempalace_data:/app/.mempalace
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    container_name: ai-task-frontend
    restart: unless-stopped
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  mempalace_data:
